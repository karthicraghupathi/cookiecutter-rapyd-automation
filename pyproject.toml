[project]
name = "cookiecutter-rapyd-automation"
version = "1.0.0"
description = "Cookiecutter template for a Python automation project."
requires-python = ">=3.10"
authors = [{name = "Karthic Raghupathi"}]
dependencies = []

[dependency-groups]
dev = [
    "cookiecutter",
    "pytest",
    "pytest-cookies",
    "ruff",
    "pre-commit",
]

[tool.ruff]
line-length = 88
target-version = "py310"
# The template directory ({{ cookiecutter.project_slug }}) contains Jinja syntax
# that ruff would mis-parse. We exclude it via a literal path, escaping the
# braces so ruff's glob parser doesn't treat them as alternation.
extend-exclude = [
    "[{][{] cookiecutter.project_slug [}][}]",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
