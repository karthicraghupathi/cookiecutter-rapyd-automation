[project]
name = "cookiecutter-rapyd-automation"
version = "1.0.0"
description = "Cookiecutter template for a Python automation project."
requires-python = ">=3.10"
authors = [{name = "Karthic Raghupathi"}]
dependencies = []

[dependency-groups]
dev = [
    "cookiecutter",
    "pytest",
    "pytest-cookies",
    "ruff",
    "pre-commit",
]

[tool.ruff]
line-length = 88
target-version = "py310"
# The template directory ({{ cookiecutter.project_slug }}) contains Jinja syntax
# that ruff would mis-parse. We exclude it via a literal path, escaping the
# braces so ruff's glob parser doesn't treat them as alternation.
extend-exclude = [
    "[{][{] cookiecutter.project_slug [}][}]",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
# E501: line length (handled by formatter)
# S101: assert in tests is fine
# S603: subprocess with list args + check=True is the safe pattern we use
# S607: PATH lookup of `git`/`uv`/`python` in the post-gen hook is intentional
ignore = ["E501", "S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
# Tests routinely use subprocess.run with capture_output=True without shell;
# all S subprocess rules in tests are noise.
"test_*.py" = ["S404", "S607"]

[tool.pytest.ini_options]
testpaths = ["test_cookiecutter.py"]
python_files = ["test_*.py"]
# Don't recurse into the cookiecutter template directory; its tests/ contains
# Jinja syntax that pytest can't import.
norecursedirs = ["{{*"]
